services:
  database:
    image: postgres:16-alpine
    container_name: school_admission_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - admission_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_admission_backend
    restart: always
    environment:
      - DB_CONNECTION_STRING=Host=database;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - HOLD_DURATION_SECONDS=${HOLD_DURATION_SECONDS:-600}
      - HOLD_CLEANUP_INTERVAL_SECONDS=${HOLD_CLEANUP_INTERVAL_SECONDS:-10}
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - admission_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: school_admission_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - admission_network

volumes:
  postgres_data:
    name: school_admission_postgres_data

networks:
  admission_network:
    name: school_admission_network
